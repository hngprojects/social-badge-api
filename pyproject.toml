[project]
name = "social-badge-api"
version = "0.1.0"
description = "social badge backend api"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "aiosmtplib>=5.1.0",
    "alembic>=1.18.4",
    "asyncpg>=0.31.0",
    "bcrypt>=5.0.0",
    "aiobreaker>=1.2.0",
    "arq>=0.28.0",
    "cloudinary>=1.44.2",
    "fastapi[all]>=0.136.1",
    "httpx>=0.28.1",
    "pillow>=12.2.0",
    "python-jose[cryptography]>=3.5.0",
    "redis[hiredis]>=7.4.0",
    "resend>=2.30.0",
    "rich>=15.0.0",
    "slowapi>=0.1.9",
    "sqlalchemy[asyncio]>=2.0.49",
    "structlog>=25.5.0",
    "uuid-utils>=0.15.0",
]

[dependency-groups]
dev = [
    "fakeredis[lua]>=2.35.1",
    "mypy>=2.1.0",
    "pre-commit>=4.6.0",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
    "ruff>=0.15.12",
    "types-python-jose>=3.5.0.20260408",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py313"
line-length = 88

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "T20", "S", "ASYNC"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]
"alembic/versions/**" = ["E501"]

[tool.uv]
# arq<=0.28.0 declares redis[hiredis]<6, but it is compatible with redis v7 at runtime.
# This override allows uv to resolve the conflict without downgrading redis.
override-dependencies = ["redis>=7.4.0"]

[tool.mypy]
python_version = "3.13"
strict = true
warn_return_any = true
warn_unused_configs = true
