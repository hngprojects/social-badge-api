name: CI

on:
  push:
    branches: [dev, staging, main]
  pull_request:
    branches: [dev, staging, main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-check:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install flake8
        run: pip install flake8
      - name: Run flake8
        run: flake8 . --count --max-line-length=120 --statistics --exclude=.git,__pycache__,alembic --exit-zero

  test:
    name: Tests
    runs-on: ubuntu-latest
    needs: lint-and-check
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install pytest
        run: pip install pytest
      - name: Run tests
        run: pytest --tb=short -q || true
