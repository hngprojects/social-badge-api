name: CD

on:
  push:
    branches:
      - staging
      - main

concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/staging'
    environment: staging
    steps:
      - name: Deploy to staging server
        uses: appleboy/ssh-action@dd404abe5e6b1c6d23c92e1a1b4ade1d1e17b2ef
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -euo pipefail
            export PATH="$HOME/.local/bin:$HOME/.local/share/pnpm:$HOME/.local/share/uv/bin:$PATH"
            cd ~/social_badge_api_staging
            git fetch origin
            git reset --hard origin/staging
            uv sync
            .venv/bin/alembic upgrade head
            pm2 restart social-badge-api-staging --update-env
            sleep 10
            if ! curl -sf http://localhost:8001/api/v1/health; then
              echo "Deploy failed, rolling back..."
              exit 1
            fi
            echo "Staging deploy successful."

  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    environment: production
    steps:
      - name: Deploy to production server
        uses: appleboy/ssh-action@dd404abe5e6b1c6d23c92e1a1b4ade1d1e17b2ef
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -euo pipefail
            export PATH="$HOME/.local/bin:$HOME/.local/share/pnpm:$HOME/.local/share/uv/bin:$PATH"
            cd ~/social_badge_api
            git fetch origin
            git reset --hard origin/main
            uv sync
            .venv/bin/alembic upgrade head
            pm2 restart social-badge-api --update-env
            sleep 10
            if ! curl -sf http://localhost:8000/probe; then
              echo "Deploy failed, rolling back..."
              exit 1
            fi
            echo "Production deploy successful."
