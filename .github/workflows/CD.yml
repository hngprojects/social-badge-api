name: CD

on:
  push:
    branches:
      - staging
      - main

concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy-staging:
    name: Deploy — Staging
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/staging'
    environment: staging

    steps:
      - name: Deploy to staging with rollback
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e
            export PATH="$HOME/.local/bin:$HOME/.local/share/uv/bin:$PATH"
            cd ~/social_badge_api_staging
            CURRENT_SHA=$(git rev-parse HEAD)
            CURRENT_REVISION=$(uv run alembic current 2>/dev/null | grep -oP '^\w+' || echo "none")
            git pull origin staging
            uv sync --python 3.13
            uv run alembic upgrade head
            pm2 restart social-badge-api-staging
            sleep 8
            if ! curl -sf http://localhost:8001/api/v1/health; then
              git checkout $CURRENT_SHA
              uv sync --python 3.13
              [ "$CURRENT_REVISION" != "none" ] && uv run alembic downgrade $CURRENT_REVISION
              pm2 restart social-badge-api-staging
              echo "Rolled back to $CURRENT_SHA"
              exit 1
            fi
            echo "Staging deploy successful."

  deploy-production:
    name: Deploy — Production
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    environment: production

    steps:
      - name: Deploy to production with rollback
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e
            export PATH="$HOME/.local/bin:$HOME/.local/share/uv/bin:$PATH"
            cd ~/social_badge_api
            CURRENT_SHA=$(git rev-parse HEAD)
            CURRENT_REVISION=$(uv run alembic current 2>/dev/null | grep -oP '^\w+' || echo "none")
            git pull origin main
            uv sync --python 3.13
            uv run alembic upgrade head
            pm2 restart social-badge-api
            sleep 8
            if ! curl -sf http://localhost:8000/api/v1/health; then
              git checkout $CURRENT_SHA
              uv sync --python 3.13
              [ "$CURRENT_REVISION" != "none" ] && uv run alembic downgrade $CURRENT_REVISION
              pm2 restart social-badge-api
              echo "Rolled back to $CURRENT_SHA"
              exit 1
            fi
            echo "Production deploy successful."
